<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.2, user-scalable=yes, viewport-fit=cover">
    <title>🗺️ 地图旅行指南针 · 世界真心话</title>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>
    <style>
        :root {
            --bg-deep: #1a2e1b;
            --bg-panel: #fefaf2;
            --accent-soft: #88a87d;
            --accent-warm: #e09e5b;
            --accent-active: #4f7a4c;
            --text-primary: #2d3a2a;
            --text-soft: #6a5f4a;
            --card-bg: #ffffff;
            --border-light: #e2d9c8;
            --shadow-card: 0 8px 20px rgba(0, 0, 0, 0.06);
            --radius-xl: 32px;
            --radius-lg: 22px;
            --radius-md: 16px;
            --radius-full: 50px;
            --transition-base: 0.25s cubic-bezier(0.2, 0.0, 0.1, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Noto Sans TC', sans-serif;
        }

        body {
            background: radial-gradient(circle at 30% 10%, #30452b, #1d2c1b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .app-wrapper {
            max-width: 1400px;
            width: 100%;
            background: rgba(26, 34, 21, 0.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 48px;
            box-shadow: 0 30px 50px -16px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 200, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(150, 180, 130, 0.25);
        }

        .header {
            background: rgba(28, 38, 20, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 28px;
            color: #fbf5e3;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid #5b7b4a;
            letter-spacing: 0.2px;
        }

        .header h1 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            background: linear-gradient(to right, #f9efd2, #e2d7b5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 0.85rem;
            opacity: 0.9;
            background: rgba(60, 80, 50, 0.5);
            padding: 6px 16px;
            border-radius: 50px;
            color: #f0eddb;
        }

        .map-and-panel {
            display: flex;
            flex-wrap: wrap;
            background: rgba(0,0,0,0.08);
        }

        .map-container {
            flex: 2.5;
            min-width: 300px;
            height: 580px;
            background: #c8ddbb;
            position: relative;
            border-right: 1px solid #7d9b6a;
            overflow: hidden;
        }

        #worldMap {
            height: 100%;
            width: 100%;
            background: #e3efd3;
        }

        .suggestions-panel {
            flex: 1.2;
            min-width: 300px;
            background: #fdf8ed;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 580px;
            backdrop-filter: blur(4px);
        }

        .panel-header {
            background: #f5eddb;
            padding: 18px 20px;
            border-bottom: 2px solid #d6c9ab;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(8px);
        }

        .panel-header h3 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.25rem;
            color: #2b4b22;
            font-weight: 600;
        }

        .selected-country {
            font-weight: 700;
            color: #c85d2c;
            background: #ffe9d4;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.95rem;
        }

        .add-suggestion-btn {
            background: #558b4b;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 60px;
            margin-top: 14px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 10px rgba(80, 110, 50, 0.25);
        }

        .add-suggestion-btn:hover:not(:disabled) {
            background: #3d6e38;
            transform: scale(1.02);
            box-shadow: 0 8px 18px rgba(60, 90, 40, 0.35);
        }

        .add-suggestion-btn:disabled {
            opacity: 0.5;
            background: #9ba98b;
            box-shadow: none;
            cursor: not-allowed;
        }

        .status-filter {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            background: #f7f1e2;
            padding: 6px 14px;
            border-radius: 50px;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
            color: #5d523a;
            transition: all var(--transition-base);
        }

        .filter-btn.active {
            background: #558b4b;
            color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        }

        .filter-btn:hover:not(.active) {
            background: #e7dcc8;
        }

        .records-list {
            padding: 16px 16px 20px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #fefaf3;
            max-height: 300px;
            min-height: 150px;
        }

        .record-card {
            background: white;
            border-radius: 24px;
            padding: 16px;
            border-left: 8px solid #9cbe88;
            box-shadow: var(--shadow-card);
            transition: all var(--transition-base);
            border: 1px solid rgba(180, 160, 130, 0.15);
        }

        .record-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px rgba(0, 0, 0, 0.08);
            border-left-color: #c9a96b;
        }

        .record-card.status-done {
            opacity: 0.7;
            background: #f5f2e9;
            border-left-color: #bcb09b;
            filter: grayscale(0.15);
        }

        .card-category {
            display: inline-block;
            background: #ecf2e0;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #456b41;
            letter-spacing: 0.3px;
        }

        .card-location {
            font-size: 0.8rem;
            color: #8b7b55;
            margin: 8px 0 4px;
            font-weight: 500;
        }

        .quote {
            font-style: italic;
            margin: 10px 0;
            font-size: 0.92rem;
            color: #2f392b;
            background: #faf4e6;
            padding: 10px 14px;
            border-radius: 18px;
            line-height: 1.4;
        }

        .rating {
            font-size: 0.75rem;
            margin: 6px 0;
            color: #ca8a3a;
            letter-spacing: 1px;
        }

        .record-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 0.7rem;
            color: #aa9b7a;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status-badge {
            font-size: 0.65rem;
            padding: 3px 12px;
            border-radius: 40px;
            background: #e9e0ce;
            color: #695f45;
            font-weight: 600;
        }

        .status-badge.done {
            background: #dad3c2;
            color: #5c543b;
            text-decoration: line-through;
        }

        .record-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .toggle-status-btn {
            background: #efe7d7;
            border: none;
            border-radius: 30px;
            padding: 5px 14px;
            font-size: 0.7rem;
            cursor: pointer;
            font-weight: 600;
            color: #4a6237;
            transition: all var(--transition-base);
        }

        .toggle-status-btn:hover {
            background: #d9cdb0;
            color: #2c431e;
        }

        .delete-record {
            background: none;
            border: none;
            color: #bc7a5a;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 40px;
            transition: all var(--transition-base);
        }

        .delete-record:hover {
            background: #ffe6d8;
            color: #a04e2e;
        }

        .empty-tip {
            text-align: center;
            padding: 48px 20px;
            color: #b9a889;
            font-size: 0.9rem;
            background: #fefbf5;
            border-radius: 28px;
        }

        /* 資料視覺化區域 */
        .visualization-section {
            border-top: 3px solid #d6c9ab;
            background: #f8f2e4;
            padding: 16px 16px 20px;
        }

        .viz-title {
            font-size: 1rem;
            font-weight: 700;
            color: #2b4b22;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .viz-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .viz-card {
            background: white;
            border-radius: 20px;
            padding: 14px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            border: 1px solid rgba(180, 160, 130, 0.2);
        }

        .viz-card h4 {
            font-size: 0.8rem;
            color: #5d523a;
            margin-bottom: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .viz-card canvas {
            width: 100%;
            height: 140px;
            display: block;
        }

        .country-bar-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .country-bar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
        }

        .country-bar-label {
            width: 70px;
            text-align: right;
            color: #5d523a;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .country-bar-track {
            flex: 1;
            height: 18px;
            background: #f0e8d5;
            border-radius: 20px;
            overflow: hidden;
        }

        .country-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #88a87d, #558b4b);
            border-radius: 20px;
            transition: width 0.6s cubic-bezier(0.2, 0.0, 0.1, 1);
            min-width: 4px;
        }

        .country-bar-count {
            width: 24px;
            text-align: left;
            font-weight: 700;
            color: #2b4b22;
            font-size: 0.7rem;
        }

        .stats-summary {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .stat-item {
            background: #fefaf2;
            border-radius: 16px;
            padding: 10px 14px;
            min-width: 70px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2b4b22;
        }

        .stat-label {
            font-size: 0.65rem;
            color: #8b7b55;
            margin-top: 2px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-content {
            background: #fffdf5;
            max-width: 460px;
            width: 92%;
            border-radius: 48px;
            padding: 28px 24px;
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.4);
            transition: all 0.2s;
        }

        .modal-content h3 {
            margin-bottom: 22px;
            display: flex;
            gap: 10px;
            align-items: center;
            color: #2e4d23;
        }

        .modal-content input,
        .modal-content select,
        .modal-content textarea {
            width: 100%;
            margin-bottom: 16px;
            padding: 13px 16px;
            border-radius: 40px;
            border: 1px solid #ddd2bb;
            background: #fffdf8;
            font-size: 0.9rem;
        }

        .modal-content textarea {
            border-radius: 24px;
            resize: vertical;
        }

        .modal-buttons {
            display: flex;
            gap: 14px;
            justify-content: flex-end;
        }

        .modal-buttons button {
            padding: 10px 22px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .save-btn {
            background: #5b8c4e;
            color: white;
        }

        .save-btn:hover {
            background: #3c6532;
        }

        .cancel-btn {
            background: #d9cfbc;
            color: #3b3a2e;
        }

        .cancel-btn:hover {
            background: #c2b59d;
        }

        .leaflet-interactive {
            cursor: pointer;
            transition: fill-opacity 0.2s, stroke 0.15s;
        }

        .leaflet-interactive:hover {
            fill-opacity: 0.8;
            stroke: #f5b042;
            stroke-width: 2;
        }

        .sync-status {
            font-size: 0.7rem;
            padding: 6px 14px;
            border-radius: 50px;
            background: #e8e0cf;
            color: #62583e;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }

        .sync-status.online {
            background: #d9eed9;
            color: #2f5c2f;
        }

        .sync-status.offline {
            background: #fce6d6;
            color: #c85d2c;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            background: #1e2d16;
            color: #b7c4a5;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-top: 1px solid #4e6b3a;
        }

        /* 手機優化 */
        @media (max-width: 800px) {
            body {
                padding: 10px;
            }

            .app-wrapper {
                border-radius: 32px;
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .map-and-panel {
                flex-direction: column;
            }

            .map-container {
                height: 380px;
                border-right: none;
                border-bottom: 1px solid #8aa877;
            }

            .suggestions-panel {
                max-height: none;
            }

            .records-list {
                max-height: 250px;
            }

            .record-card {
                padding: 14px;
            }

            .modal-content {
                padding: 22px 18px;
            }

            .viz-card canvas {
                height: 120px;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 12px 16px;
            }

            .status-filter {
                flex-wrap: wrap;
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="header">
            <h1>🗺️ 地图旅行指南针 · 世界真心话</h1>
            <p>✈️ 点击国家 → 留下/浏览建议 · 标记「去过✓」</p>
        </div>
        <div class="map-and-panel">
            <div class="map-container">
                <div id="worldMap"></div>
            </div>
            <div class="suggestions-panel" id="suggestionsPanel">
                <div class="panel-header">
                    <h3>📍 当前地点：<span id="selectedCountryName" class="selected-country">尚未选择国家</span></h3>
                    <button id="openAddBtn" class="add-suggestion-btn" disabled>➕ 为此地添加一条旅行建议</button>
                    <div class="status-filter">
                        <span style="font-size:0.7rem; font-weight:500;">🔍 筛选：</span>
                        <button class="filter-btn active" data-filter="all">全部</button>
                        <button class="filter-btn" data-filter="active">✨ 想去</button>
                        <button class="filter-btn" data-filter="done">✅ 去过</button>
                    </div>
                </div>
                <div class="records-list" id="recordsList">
                    <div class="empty-tip">✨ 点击地图上的国家，查看当地旅行真心话</div>
                </div>
                <!-- 資料視覺化區域 -->
                <div class="visualization-section" id="visualizationSection">
                    <div class="viz-title">📊 旅行數據總覽</div>
                    <div class="stats-summary" id="statsSummary">
                        <div class="stat-item">
                            <div class="stat-value" id="statTotal">0</div>
                            <div class="stat-label">總建議數</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="statCountries">0</div>
                            <div class="stat-label">涵蓋國家</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="statDone">0</div>
                            <div class="stat-label">已體驗</div>
                        </div>
                    </div>
                    <div class="viz-grid">
                        <div class="viz-card">
                            <h4>📂 建議類別分布</h4>
                            <canvas id="categoryChart"></canvas>
                        </div>
                        <div class="viz-card">
                            <h4>⭐ 評分分布</h4>
                            <canvas id="ratingChart"></canvas>
                        </div>
                        <div class="viz-card">
                            <h4>🏆 熱門國家 Top 6</h4>
                            <div class="country-bar-list" id="countryBarList">
                                <div style="text-align:center;color:#b9a889;font-size:0.8rem;">尚無數據</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <footer>
            <span>💡 标记「已完成」代表你体验过该建议 · 数据同步至 Google Sheet</span>
            <span class="sync-status" id="syncStatus">🔄 检查连接...</span>
        </footer>
    </div>

    <!-- 模态窗表单 -->
    <div id="suggestionModal" class="modal">
        <div class="modal-content">
            <h3>📝 给 <span id="modalCountrySpan"></span> 写一句真心话</h3>
            <textarea id="modalContent" rows="3" placeholder="例：圣托里尼傍晚一定要去伊亚看日落，人少景美" maxlength="240"></textarea>
            <input type="text" id="modalLocationDetail" placeholder="具体地点 (可选，如：伊亚小镇)" value="">
            <select id="modalCategory">
                <option value="景点秘境">🌄 景点秘境</option>
                <option value="美食探店">🍜 美食探店</option>
                <option value="避坑指南">⚠️ 避坑指南</option>
                <option value="冷门技巧">💡 冷门技巧</option>
                <option value="在地体验">🎭 在地体验</option>
            </select>
            <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                <label>⭐ 推荐指数：</label>
                <input type="number" id="modalRating" min="1" max="5" value="5" style="width: 80px;">
                <input type="text" id="modalTag" placeholder="标签 (自由/小众/免费)" style="flex:1;">
            </div>
            <div class="modal-buttons">
                <button class="cancel-btn" id="closeModalBtn">取消</button>
                <button class="save-btn" id="saveSuggestionBtn">保存指南</button>
            </div>
        </div>
    </div>

    <script>
        /**********************************************************
         * GOOGLE SHEET BACKEND CONNECTOR
         **********************************************************/
        const APPS_SCRIPT_URL =
            "https://script.google.com/macros/s/AKfycbyVlTlljhhvou1yVnFQJ7pj8vki6q4vWjn1JZ6NkOCOl5bHYa6cRV1ibwVcGGo-PQLYrQ/exec";

        let isOnline = false;

        function normalizeRecord(record) {
            const normalized = {};
            for (const key of Object.keys(record)) {
                let value = record[key];
                if (key === "rating") {
                    value = Number(value) || 5;
                }
                if (key === "createdAt") {
                    value = Number(value) || Date.now();
                }
                if (key === "status") {
                    value = String(value || "active");
                }
                normalized[key] = value;
            }
            if (!normalized.id) {
                normalized.id = generateId();
            }
            if (!normalized.status) normalized.status = "active";
            if (!normalized.createdAt) normalized.createdAt = Date.now();
            if (!normalized.rating) normalized.rating = 5;
            if (!normalized.countryName) normalized.countryName = "";
            if (!normalized.content) normalized.content = "";
            if (!normalized.category) normalized.category = "景点秘境";
            return normalized;
        }

        async function syncToSheet(payload) {
            if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")) {
                console.warn("APPS_SCRIPT_URL 未設定，跳過同步");
                updateSyncStatus(false);
                return { ok: false, error: "URL not set" };
            }
            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.ok) {
                    updateSyncStatus(true);
                } else {
                    console.error("Sheet sync error:", result.error);
                    updateSyncStatus(false);
                }
                return result;
            } catch (err) {
                console.error("Sheet sync failed:", err.message);
                updateSyncStatus(false);
                return { ok: false, error: err.message };
            }
        }

        async function fetchRecordsFromSheet() {
            if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR")) {
                console.warn("APPS_SCRIPT_URL 未設定");
                updateSyncStatus(false);
                return [];
            }
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();
                if (data.ok && Array.isArray(data.records)) {
                    const normalized = data.records.map(rec => normalizeRecord(rec));
                    updateSyncStatus(true);
                    return normalized;
                } else {
                    console.error("Sheet fetch error:", data.error);
                    updateSyncStatus(false);
                    return [];
                }
            } catch (err) {
                console.error("Sheet fetch failed:", err.message);
                updateSyncStatus(false);
                return [];
            }
        }

        function updateSyncStatus(online) {
            isOnline = online;
            const statusEl = document.getElementById("syncStatus");
            if (statusEl) {
                if (online) {
                    statusEl.textContent = "🟢 已同步 Sheet";
                    statusEl.className = "sync-status online";
                } else {
                    statusEl.textContent = "🔴 离线模式 (localStorage)";
                    statusEl.className = "sync-status offline";
                }
            }
        }

        let allRecords = [];
        let currentSelectedCountry = null;
        let currentFilter = 'all';

        const recordsListDiv = document.getElementById('recordsList');
        const selectedCountrySpan = document.getElementById('selectedCountryName');
        const openAddBtn = document.getElementById('openAddBtn');
        const modal = document.getElementById('suggestionModal');
        const modalCountrySpan = document.getElementById('modalCountrySpan');
        const modalContent = document.getElementById('modalContent');
        const modalLocationDetail = document.getElementById('modalLocationDetail');
        const modalCategory = document.getElementById('modalCategory');
        const modalRating = document.getElementById('modalRating');
        const modalTag = document.getElementById('modalTag');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const saveSuggestionBtn = document.getElementById('saveSuggestionBtn');

        let map;
        let geoJsonLayer;

        function generateId() {
            return 'rec_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
        }

        function loadDataFromLS() {
            const stored = localStorage.getItem('travel_records');
            if (!stored) return [];
            try {
                return JSON.parse(stored);
            } catch (e) {
                return [];
            }
        }

        function persistToLocalStorage() {
            localStorage.setItem('travel_records', JSON.stringify(allRecords));
        }

        async function loadData() {
            const sheetRecords = await fetchRecordsFromSheet();
            if (sheetRecords.length > 0) {
                allRecords = sheetRecords;
                persistToLocalStorage();
            } else if (sheetRecords.length === 0 && isOnline) {
                allRecords = [];
                persistToLocalStorage();
            } else {
                console.warn("無法從 Sheet 讀取，使用 localStorage");
                allRecords = loadDataFromLS();
            }

            let needUpdate = false;
            allRecords = allRecords.map(rec => {
                if (!rec.status) {
                    needUpdate = true;
                    return { ...rec, status: 'active' };
                }
                return rec;
            });
            if (needUpdate) {
                persistToLocalStorage();
            }

            renderDataVisualization();

            if (currentSelectedCountry) {
                renderListForCountryWithFilter(currentSelectedCountry);
            } else {
                renderList([]);
            }
        }

        async function saveData(record) {
            const existingIndex = allRecords.findIndex(r => r.id === record.id);
            if (existingIndex !== -1) {
                allRecords[existingIndex] = record;
            } else {
                allRecords.push(record);
            }
            persistToLocalStorage();

            syncToSheet({ action: "create", record: record }).then(result => {
                if (!result.ok) {
                    console.warn("Sheet create sync failed, saved to localStorage only");
                }
            });

            if (currentSelectedCountry && record.countryName === currentSelectedCountry) {
                renderListForCountryWithFilter(currentSelectedCountry);
            }
            renderDataVisualization();
        }

        function createRecord(formData) {
            return {
                id: generateId(),
                countryName: formData.countryName,
                content: formData.content.trim(),
                category: formData.category,
                locationDetail: formData.locationDetail ? formData.locationDetail.trim() : '',
                rating: Number(formData.rating),
                tag: formData.tag ? formData.tag.trim() : '',
                createdAt: Date.now(),
                status: 'active'
            };
        }

        async function updateRecord(id, changes) {
            const index = allRecords.findIndex(r => r.id === id);
            if (index === -1) return false;
            const updated = { ...allRecords[index], ...changes };
            allRecords[index] = updated;
            persistToLocalStorage();

            syncToSheet({ action: "update", id: id, changes: changes }).then(result => {
                if (!result.ok) {
                    console.warn("Sheet update sync failed, saved to localStorage only");
                }
            });

            if (currentSelectedCountry && updated.countryName === currentSelectedCountry) {
                renderListForCountryWithFilter(currentSelectedCountry);
            }
            renderDataVisualization();
            return true;
        }

        async function deleteRecordById(id) {
            const recordToDel = allRecords.find(r => r.id === id);
            if (!recordToDel) return;
            allRecords = allRecords.filter(r => r.id !== id);
            persistToLocalStorage();

            syncToSheet({ action: "delete", id: id }).then(result => {
                if (!result.ok) {
                    console.warn("Sheet delete sync failed, removed from localStorage only");
                }
            });

            if (currentSelectedCountry && recordToDel.countryName === currentSelectedCountry) {
                renderListForCountryWithFilter(currentSelectedCountry);
            }
            renderDataVisualization();
        }

        function getFilteredRecordsByCountry(countryName) {
            let records = allRecords.filter(rec => rec.countryName === countryName);
            if (currentFilter === 'active') {
                records = records.filter(rec => rec.status === 'active');
            } else if (currentFilter === 'done') {
                records = records.filter(rec => rec.status === 'done');
            }
            return records.sort((a, b) => b.createdAt - a.createdAt);
        }

        function renderList(recordsToShow) {
            if (!recordsListDiv) return;
            if (!recordsToShow || recordsToShow.length === 0) {
                let message = '';
                if (currentFilter === 'active') message = '✨ 没有「想去」的指南，点击添加吧 ✨';
                else if (currentFilter === 'done') message = '✅ 暂无「去过」标记的指南，试试切换状态～';
                else message = '✨ 暂无人分享，快成为第一个留下指南的旅行者吧 ✨';
                recordsListDiv.innerHTML = `<div class="empty-tip">${message}</div>`;
                return;
            }
            let html = '';
            for (let rec of recordsToShow) {
                const isDone = rec.status === 'done';
                const cardDoneClass = isDone ? 'status-done' : '';
                const safeContent = escapeHtml(rec.content);
                const safeLocationDetail = escapeHtml(rec.locationDetail || '');
                const safeTag = rec.tag ? escapeHtml(rec.tag) : '';
                const ratingStars = '⭐'.repeat(rec.rating) + '☆'.repeat(5 - rec.rating);
                const dateStr = new Date(rec.createdAt).toLocaleDateString('zh-CN', { month: 'numeric',
                    day: 'numeric', hour: '2-digit', minute: '2-digit' });
                const displayLoc = safeLocationDetail ? `${safeLocationDetail}` : '某处';
                const statusText = isDone ? '✅ 已完成' : '✨ 想去';
                const toggleLabel = isDone ? '🔄 标记为想去' : '✔️ 标记去过';

                html += `
                <div class="record-card ${cardDoneClass}" data-id="${rec.id}">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="card-category">${escapeHtml(rec.category)}</span>
                        <span class="status-badge ${isDone ? 'done' : ''}">${statusText}</span>
                    </div>
                    <div class="card-location">📍 ${displayLoc}</div>
                    <div class="quote">" ${safeContent} "</div>
                    <div class="rating">${ratingStars}</div>
                    <div class="record-footer">
                        <span>🏷️ ${safeTag ? '#'+safeTag : '无标签'}</span>
                        <span>📅 ${dateStr}</span>
                        <div class="record-actions">
                            <button class="toggle-status-btn" data-id="${rec.id}" data-status="${rec.status}">${toggleLabel}</button>
                            <button class="delete-record" data-id="${rec.id}">🗑️ 删除</button>
                        </div>
                    </div>
                </div>
                `;
            }
            recordsListDiv.innerHTML = html;

            document.querySelectorAll('.toggle-status-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.getAttribute('data-id');
                    const currentStatus = btn.getAttribute('data-status');
                    const newStatus = currentStatus === 'active' ? 'done' : 'active';
                    updateRecord(id, { status: newStatus });
                });
            });

            document.querySelectorAll('.delete-record').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.getAttribute('data-id');
                    if (confirm('删除这条旅行指南？')) {
                        deleteRecordById(id);
                    }
                });
            });
        }

        function renderListForCountryWithFilter(countryName) {
            const filteredRecords = getFilteredRecordsByCountry(countryName);
            renderList(filteredRecords);
            updateMapHeatmap();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.getAttribute('data-filter') === filter) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            if (currentSelectedCountry) {
                renderListForCountryWithFilter(currentSelectedCountry);
            } else {
                renderList([]);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function onCountryClick(countryName) {
            if (!countryName) return;
            currentSelectedCountry = countryName;
            selectedCountrySpan.innerText = countryName;
            openAddBtn.disabled = false;
            renderListForCountryWithFilter(countryName);
        }

        function openAddSuggestionModal() {
            if (!currentSelectedCountry) {
                alert('请先点击地图选择一个国家');
                return;
            }
            modalCountrySpan.innerText = currentSelectedCountry;
            modalContent.value = '';
            modalLocationDetail.value = '';
            modalCategory.value = '景点秘境';
            modalRating.value = '5';
            modalTag.value = '';
            modal.style.display = 'flex';
        }

        function saveNewSuggestion() {
            if (!currentSelectedCountry) {
                alert('未选中任何国家，请点击地图');
                modal.style.display = 'none';
                return;
            }
            const content = modalContent.value.trim();
            if (!content) {
                alert('请填写一句旅行真心话 ✏️');
                return;
            }
            const formData = {
                countryName: currentSelectedCountry,
                content: content,
                category: modalCategory.value,
                locationDetail: modalLocationDetail.value.trim(),
                rating: modalRating.value,
                tag: modalTag.value.trim()
            };
            const newRecord = createRecord(formData);
            saveData(newRecord);
            modal.style.display = 'none';
        }

        function updateMapHeatmap() {
            if (!geoJsonLayer) return;
            const countryCountMap = new Map();
            allRecords.forEach(rec => {
                if (rec.countryName) {
                    countryCountMap.set(rec.countryName, (countryCountMap.get(rec.countryName) || 0) + 1);
                }
            });

            geoJsonLayer.eachLayer(layer => {
                const feature = layer.feature;
                if (!feature || !feature.properties) return;
                let countryName = feature.properties?.ADMIN || feature.properties?.name || feature.properties?.NAME;
                const nameMap = {
                    "United States": "美国", "China": "中国", "Japan": "日本", "India": "印度",
                    "United Kingdom": "英国", "France": "法国", "Germany": "德国", "Italy": "意大利",
                    "Spain": "西班牙", "Australia": "澳大利亚", "Canada": "加拿大", "Brazil": "巴西",
                    "Russia": "俄罗斯", "Mexico": "墨西哥", "Thailand": "泰国", "Vietnam": "越南",
                    "South Korea": "韩国", "Indonesia": "印度尼西亚", "Turkey": "土耳其", "Egypt": "埃及"
                };
                if (nameMap[countryName]) countryName = nameMap[countryName];
                const count = countryCountMap.get(countryName) || 0;
                let fillColor = '#88b574';
                let fillOpacity = 0.5;
                if (count >= 6) { fillColor = '#d97746'; fillOpacity = 0.75; }
                else if (count >= 4) { fillColor = '#e09e5b'; fillOpacity = 0.7; }
                else if (count >= 2) { fillColor = '#b8a75b'; fillOpacity = 0.65; }
                else if (count === 1) { fillColor = '#9cbe88'; fillOpacity = 0.6; }
                layer.setStyle({ fillColor: fillColor, fillOpacity: fillOpacity });
            });
        }

        // ==================== 資料視覺化 Functions ====================

        function calculateStats() {
            const total = allRecords.length;
            const countrySet = new Set(allRecords.map(r => r.countryName).filter(Boolean));
            const doneCount = allRecords.filter(r => r.status === 'done').length;
            return { total, countries: countrySet.size, done: doneCount };
        }

        function drawCategoryChart() {
            const canvas = document.getElementById('categoryChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = 140 * dpr;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = '140px';
            ctx.scale(dpr, dpr);

            const categories = ['景点秘境', '美食探店', '避坑指南', '冷门技巧', '在地体验'];
            const colors = ['#88a87d', '#e09e5b', '#d97746', '#6b8c5c', '#c9a96b'];
            const counts = categories.map(cat => allRecords.filter(r => r.category === cat).length);
            const maxCount = Math.max(...counts, 1);
            const barWidth = (rect.width - 60) / categories.length;

            ctx.clearRect(0, 0, rect.width, 140);

            counts.forEach((count, i) => {
                const x = 30 + i * barWidth;
                const barH = (count / maxCount) * 90;
                const y = 120 - barH;

                // Bar
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.roundRect(x + 4, y, barWidth - 12, barH, [6, 6, 0, 0]);
                ctx.fill();

                // Count label
                ctx.fillStyle = '#2b4b22';
                ctx.font = 'bold 11px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText(count, x + barWidth / 2, y - 6);

                // Category label
                ctx.fillStyle = '#5d523a';
                ctx.font = '9px system-ui';
                ctx.fillText(categories[i].replace('指南', ''), x + barWidth / 2, 135);
            });
        }

        function drawRatingChart() {
            const canvas = document.getElementById('ratingChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = 140 * dpr;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = '140px';
            ctx.scale(dpr, dpr);

            const ratings = [1, 2, 3, 4, 5];
            const colors = ['#d97746', '#e09e5b', '#c9a96b', '#9cbe88', '#558b4b'];
            const counts = ratings.map(r => allRecords.filter(rec => rec.rating === r).length);
            const maxCount = Math.max(...counts, 1);

            ctx.clearRect(0, 0, rect.width, 140);
            const centerX = rect.width / 2;
            const centerY = 65;
            const outerRadius = 50;
            const innerRadius = 25;
            let startAngle = -Math.PI / 2;

            counts.forEach((count, i) => {
                if (count === 0) return;
                const sliceAngle = (count / allRecords.length) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, outerRadius, startAngle, startAngle + sliceAngle);
                ctx.closePath();
                ctx.fillStyle = colors[i];
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
                startAngle += sliceAngle;
            });

            // Inner circle
            ctx.beginPath();
            ctx.arc(centerX, centerY, innerRadius, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();

            // Legend
            const legendX = 15;
            ratings.forEach((r, i) => {
                const y = 10 + i * 22;
                ctx.fillStyle = colors[i];
                ctx.fillRect(legendX, y, 10, 10);
                ctx.fillStyle = '#5d523a';
                ctx.font = '9px system-ui';
                ctx.textAlign = 'left';
                ctx.fillText(`${r}星 (${counts[i]})`, legendX + 14, y + 9);
            });
        }

        function drawTopCountries() {
            const container = document.getElementById('countryBarList');
            if (!container) return;

            const countryMap = new Map();
            allRecords.forEach(rec => {
                if (rec.countryName) {
                    countryMap.set(rec.countryName, (countryMap.get(rec.countryName) || 0) + 1);
                }
            });

            const sorted = Array.from(countryMap.entries())
                .sort((a, b) => b[1] - a[1])
                .slice(0, 6);

            if (sorted.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#b9a889;font-size:0.8rem;">尚無數據</div>';
                return;
            }

            const maxCount = sorted[0][1];
            let html = '';
            sorted.forEach(([country, count]) => {
                const percent = Math.max((count / maxCount) * 100, 8);
                html += `
                <div class="country-bar-item">
                    <span class="country-bar-label">${escapeHtml(country)}</span>
                    <div class="country-bar-track">
                        <div class="country-bar-fill" style="width:${percent}%"></div>
                    </div>
                    <span class="country-bar-count">${count}</span>
                </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderDataVisualization() {
            const stats = calculateStats();

            // Update summary numbers
            const statTotal = document.getElementById('statTotal');
            const statCountries = document.getElementById('statCountries');
            const statDone = document.getElementById('statDone');
            if (statTotal) statTotal.textContent = stats.total;
            if (statCountries) statCountries.textContent = stats.countries;
            if (statDone) statDone.textContent = stats.done;

            // Draw charts
            drawCategoryChart();
            drawRatingChart();
            drawTopCountries();
        }

                            onCountryClick(countryName);
                            layer.setStyle({ fillOpacity: 0.9, weight: 2.5, color: '#f5a623' });
                            setTimeout(() => {
                                geoJsonLayer.resetStyle(layer);
                                updateMapHeatmap();

                console.warn("GeoJSON 載入失敗，使用基礎底圖", err);
                map.setView([20, 0], 2);
            }
        }

        function bindUIEvents() {
            openAddBtn.addEventListener('click', openAddSuggestionModal);
            closeModalBtn.addEventListener('click', () => { modal.style.display = 'none'; });
            saveSuggestionBtn.addEventListener('click', saveNewSuggestion);
            window.addEventListener('click', (e) => {
                if (e.target === modal) modal.style.display = 'none';
            });
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const filterValue = btn.getAttribute('data-filter');
                    if (filterValue) setFilter(filterValue);
                });
            });

            // Redraw charts on window resize
            window.addEventListener('resize', () => {
                drawCategoryChart();
                drawRatingChart();
            });
        }

        async function init() {
            await loadData();
            initMap();
            bindUIEvents();
            openAddBtn.disabled = true;
            selectedCountrySpan.innerText = '请点击国家';
            setFilter('all');
            renderList([]);
            renderDataVisualization();
        }

        init();
    </script>
